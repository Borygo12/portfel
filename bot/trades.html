<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Trader — tready</title>
<style>
  :root {
    --bg: #0a0d13; --elev: #10141d; --card: #141926; --border: #232b3d; --border2: #2d3750;
    --text: #e8ebf2; --muted: #8b93a7; --dim: #5c6479;
    --green: #2fd48a; --red: #ff5c6c; --amber: #ffb454; --accent: #5b8cff; --violet: #a78bfa;
    --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: radial-gradient(1200px 600px at 80% -10%, #131a2b 0%, var(--bg) 55%); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  nav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px;
        padding: 0 22px; height: 56px; background: rgba(10,13,19,.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .brand { font-weight: 800; font-size: 16px; margin-right: 22px; } .brand span { color: var(--accent); }
  .navlink { padding: 8px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); transition: .15s; display:flex; align-items:center; gap:7px; }
  .navlink:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .navlink.active { color: var(--text); background: rgba(91,140,255,.14); }
  .navlink.soon { color: var(--dim); }
  .navlink .tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: rgba(167,139,250,.16); color: var(--violet); }
  main { padding: 22px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 19px; margin-bottom: 4px; } .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .tcard { background: linear-gradient(180deg, var(--card), var(--elev)); border: 1px solid var(--border); border-radius: 16px; padding: 18px; border-left: 3px solid var(--dim); }
  .tcard.BUY { border-left-color: var(--green); } .tcard.SELL { border-left-color: var(--red); }
  .tc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .tc-sym { font-size: 17px; font-weight: 800; }
  .dir { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 7px; letter-spacing: .5px; }
  .dir.BUY { background: rgba(47,212,138,.16); color: var(--green); } .dir.SELL { background: rgba(255,92,108,.16); color: var(--red); }
  .held-tag { margin-left: auto; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 7px; background: rgba(255,180,84,.16); color: var(--amber); }
  .pnl { font-size: 26px; font-weight: 800; margin-bottom: 2px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .rows { margin: 12px 0; }
  .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .row span { color: var(--muted); }
  .bar-wrap { background: #0e1320; border: 1px solid var(--border); border-radius: 999px; height: 14px; overflow: hidden; margin: 8px 0 4px; }
  .bar { height: 100%; background: linear-gradient(90deg, var(--green), var(--amber), var(--red)); transition: width .5s; }
  .barlabel { font-size: 11px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { border: 0; border-radius: 9px; padding: 10px; font-weight: 700; cursor: pointer; font-size: 12.5px; flex: 1; }
  .btn-open { background: var(--accent); color: #fff; }
  .btn-close { background: var(--red); color: #fff; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; font-size: 14px; }
  #toast { position: fixed; bottom: 22px; right: 22px; background: var(--green); color: #04140c; padding: 11px 18px; border-radius: 10px; font-weight: 700; opacity: 0; transition: .3s; }
</style>
</head>
<body>
<nav>
  <div class="brand">News<span>Trader</span></div>
  <a class="navlink" href="/bot">Panel</a>
  <a class="navlink active" href="/trades">Tready</a>
  <a class="navlink" href="/backtest">Backtesty</a>
  <a class="navlink" href="/live">Wystąpienia na żywo</a>
  <a class="navlink" href="/brain">🧠 Mózg AI</a>
  <a class="navlink" href="/settings">Ustawienia</a>
  <a class="navlink soon" href="/ict">ICT Worrior <span class="tag">SOON</span></a>
</nav>
<main>
  <h1>Aktywne tready i zlecenia</h1>
  <div class="sub">Wszystkie otwarte pozycje bota. Każda ma pełną kontrolę: zamknij ręcznie albo przejmij (bot jej nie ruszy automatycznie).</div>
  <div class="cards" id="cards"><div class="empty">ładowanie…</div></div>
</main>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => v == null ? "—" : Number(v).toFixed(d);
const esc = t => { const d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; };

async function refresh() {
  let d;
  try { d = await (await fetch("/api/trades")).json(); } catch { return; }
  if (d.error) { $("cards").innerHTML = `<div class="empty">Błąd brokera: ${esc(d.error)}</div>`; return; }
  const t = d.trades || [];
  if (!t.length) { $("cards").innerHTML = `<div class="empty">Brak otwartych pozycji.<br>Bot otworzy je automatycznie na sygnał — wróć do <a href="/bot" style="color:var(--accent)">Panelu</a>, żeby go uruchomić.</div>`; return; }
  $("cards").innerHTML = t.map(p => {
    const pnlCls = (p.pnl||0) >= 0 ? "pos" : "neg";
    const moveCls = (p.move_pct||0) >= 0 ? "pos" : "neg";
    const priced = p.priced_in ?? 0;
    return `<div class="tcard ${p.direction}">
      <div class="tc-top">
        <span class="tc-sym">${esc(p.name||p.epic)}</span>
        <span class="dir ${p.direction}">${p.direction}</span>
        ${p.held ? `<span class="held-tag">RĘCZNA KONTROLA</span>` : ""}
      </div>
      <div class="pnl num ${pnlCls}">${fmt(p.pnl)} €</div>
      <div class="barlabel num ${moveCls}">${fmt(p.move_pct)}% ceny</div>
      <div class="rows">
        <div class="row"><span>Wejście → teraz</span><b class="num">${fmt(p.openLevel)} → ${fmt(p.currentLevel)}</b></div>
        <div class="row"><span>Wielkość</span><b class="num">${fmt(p.size)}</b></div>
        <div class="row"><span>Otwarta od</span><b class="num">${fmt(p.hours_open,1)} h / max ${p.max_hold_hours} h</b></div>
      </div>
      <div class="barlabel">Wycenienie informacji: <b>${priced}%</b></div>
      <div class="bar-wrap"><div class="bar" style="width:${priced}%"></div></div>
      <div class="actions">
        <button class="btn btn-open" onclick="location.href='/position?id=${p.dealId}'">Kontrola</button>
        <button class="btn btn-close" onclick="closePos('${p.dealId}')">Zamknij</button>
      </div>
    </div>`;
  }).join("");
}
async function closePos(id) {
  if (!confirm("Zamknąć tę pozycję po cenie rynkowej?")) return;
  const r = await (await fetch(`/api/position/${id}/close`, { method: "POST" })).json();
  toast(r.closed ? "Zamknięto" : "Nie udało się — sprawdź MT5");
  setTimeout(refresh, 1000);
}
function toast(m) { const t = $("toast"); t.textContent = m; t.style.opacity = 1; setTimeout(()=>t.style.opacity=0, 2600); }
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
