<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Trader — kontrola pozycji</title>
<style>
  :root {
    --bg: #0b0e14; --card: #131826; --border: #232b3d;
    --text: #e6e9f0; --muted: #8b93a7;
    --green: #2fd48a; --red: #ff5c6c; --amber: #ffb454; --accent: #5b8cff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 20px; } h1 span { color: var(--accent); }
  a.nav { color: var(--accent); text-decoration: none; font-size: 13px; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
  .big { font-size: 26px; font-weight: 700; }
  .pos { color: var(--green); } .neg { color: var(--red); } .amber { color: var(--amber); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
  .stat { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .stat span { color: var(--muted); }
  .bar-wrap { background: #0e1320; border: 1px solid var(--border); border-radius: 999px; height: 18px; overflow: hidden; margin-top: 8px; }
  .bar { height: 100%; background: linear-gradient(90deg, var(--green), var(--amber), var(--red)); transition: width .5s; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  button { border: 0; border-radius: 8px; padding: 12px 16px; font-weight: 700; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 10px; }
  .btn-close { background: var(--red); color: #fff; }
  .btn-hold { background: var(--amber); color: #1a1400; }
  .btn-hold.active { background: var(--green); color: #04140c; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #04140c; padding: 10px 16px; border-radius: 8px; font-weight: 700; opacity: 0; transition: .3s; }
  .tnav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; margin: -20px auto 20px; max-width: 680px;
          padding: 0 4px; height: 56px; border-bottom: 1px solid var(--border); }
  .tnav .brand { font-weight: 800; font-size: 16px; margin-right: 18px; } .tnav .brand span { color: var(--accent); }
  .tnav a { padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; display:flex; align-items:center; gap:6px; }
  .tnav a:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .tnav a.active { color: var(--text); background: rgba(91,140,255,.14); }
  .tnav a.soon { color: #5c6479; } .tnav a .tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: rgba(167,139,250,.16); color: #a78bfa; }
</style>
</head>
<body>
<div class="tnav">
  <div class="brand">News<span>Trader</span></div>
  <a href="/bot">Panel</a>
  <a class="active" href="/trades">Tready</a>
  <a href="/backtest">Backtesty</a>
  <a href="/live">Wystąpienia na żywo</a>
  <a href="/brain">🧠 Mózg AI</a>
  <a href="/settings">Ustawienia</a>
</div>
<header style="max-width:680px;margin:0 auto 16px">
  <h1 style="font-size:19px">Kontrola pozycji</h1>
</header>

<div id="content"><div class="card"><div class="empty">ładowanie…</div></div></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => v == null ? "—" : Number(v).toFixed(d);
const pid = new URLSearchParams(location.search).get("id");
let held = false;

async function refresh() {
  const p = await (await fetch(`/api/position/${pid}`)).json();
  if (p.error) {
    $("content").innerHTML = `<div class="card"><div class="empty">${p.error}<br><br>
      <a class="nav" href="/bot">← wróć do panelu</a></div></div>`;
    return;
  }
  held = !!p.held;
  const pnlCls = (p.pnl||0) >= 0 ? "pos" : "neg";
  const moveCls = (p.move_pct||0) >= 0 ? "pos" : "neg";
  const pricedCls = p.priced_in >= 80 ? "neg" : p.priced_in >= 50 ? "amber" : "pos";
  $("content").innerHTML = `
  <div class="card">
    <h2>${p.name || p.epic} · ${p.direction} · #${p.dealId}</h2>
    <div class="big ${pnlCls}">${fmt(p.pnl)} € <small style="font-size:14px" class="${moveCls}">(${fmt(p.move_pct)}% ceny)</small></div>
    <div class="grid2" style="margin-top:14px">
      <div class="stat"><span>Wejście</span><b>${fmt(p.openLevel)}</b></div>
      <div class="stat"><span>Teraz</span><b>${fmt(p.currentLevel)}</b></div>
      <div class="stat"><span>Wielkość</span><b>${fmt(p.size)}</b></div>
      <div class="stat"><span>Otwarta od</span><b>${fmt(p.hours_open, 1)} h / max ${p.max_hold_hours} h</b></div>
    </div>
  </div>

  <div class="card">
    <h2>Wycenienie informacji przez rynek</h2>
    <div class="big ${pricedCls}">${p.priced_in}%</div>
    <div class="bar-wrap"><div class="bar" style="width:${p.priced_in}%"></div></div>
    <div class="hint">Rośnie z czasem (100% po ${fmt(p.priced_in_hours, 0)} h) i z ruchem ceny
    (100% przy +${p.runaway_tp_pct}% = próg auto take-profit). Im wyżej, tym mniej świeżej przewagi zostało w tej pozycji.</div>
  </div>

  <div class="card">
    <h2>Kontrola</h2>
    <button class="btn-hold ${held ? "active" : ""}" onclick="toggleHold()">
      ${held ? "✓ TRZYMAM RĘCZNIE — bot nie zamknie automatycznie (kliknij, by przywrócić automat)"
             : "Przejmij kontrolę: TRZYMAJ (wyłącz auto-zamknięcie czasowe i runaway TP)"}</button>
    <button class="btn-close" onclick="closePos()">ZAMKNIJ POZYCJĘ TERAZ</button>
    <div class="hint">${held
      ? "Pozycja pod twoją ręczną kontrolą. Stop-loss i take-profit u brokera DALEJ chronią pozycję. Limit czasu i runaway TP bota są dla niej wyłączone."
      : `Automat: bot zamknie pozycję po ${p.max_hold_hours} h albo przy zysku +${p.runaway_tp_pct}% (runaway take-profit). SL/TP u brokera aktywne.`}</div>
  </div>`;
}

async function closePos() {
  if (!confirm("Zamknąć tę pozycję po cenie rynkowej?")) return;
  const r = await (await fetch(`/api/position/${pid}/close`, { method: "POST" })).json();
  toast(r.closed ? "Pozycja zamknięta" : "Nie udało się zamknąć — sprawdź MT5");
  setTimeout(refresh, 1200);
}
async function toggleHold() {
  await fetch(`/api/position/${pid}/hold`, { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({ hold: !held }) });
  toast(!held ? "Pozycja pod ręczną kontrolą" : "Przywrócono automat");
  refresh();
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2500); }

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
