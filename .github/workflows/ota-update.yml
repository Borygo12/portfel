name: OTA Update (Expo)

# Każdy push na main → automatyczny OTA update do użytkowników
# Aktualizuje TYLKO kod JS/TS/assets — bez rebuildu natywnego
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'  # tylko gdy zmiany dotyczą apki mobilnej

jobs:
  ota-update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA update
        run: |
          eas update --channel production --message "${{ github.event.head_commit.message }}" --non-interactive
